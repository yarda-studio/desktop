[package]
name = "yarda"
version = "0.2.2"
description = "Yarda — desktop Bible study app"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.78"

# Dev builds: opt-level 2 gives ~80% of release speed with fast incremental compiles.
# This is what `tauri dev` uses — makes the app feel responsive during development.
[profile.dev]
opt-level = 2

# Release builds: strong optimisation balanced against CI build time.
# thin LTO inlines across crate boundaries (same effect as fat for an app
# binary) but parallelises the link step — typically 2-3× faster than fat
# with negligible binary size or runtime difference for a desktop app.
# codegen-units=4 lets rustc parallelise code generation; the last ~5% of
# optimisation that codegen-units=1 buys isn't worth the serial wait in CI.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true

[lib]
name = "yarda_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "yarda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
flate2 = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
regex = "1"
once_cell = "1"
tar = "0.4"
thiserror = "1"
log = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
